name: ai-knowledge-hub-dev

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Please set MYSQL_ROOT_PASSWORD in your environment variables,MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-ai_knowledge_hub}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4.2-alpine
    user: redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Please set REDIS_PASSWORD in backend/.env}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q '^PONG$'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    ports:
      # REST API 和 Dashboard 只供本机开发使用，避免暴露向量数据到局域网。
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      # 后续 Python Client 如需 gRPC 时使用；当前阶段仍只定义 VectorStore 边界。
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # 固定镜像没有 curl/wget；Bash TCP 检查确认 HTTP 端口已开始监听。
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Please set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Please set MINIO_ROOT_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # mc 的意思就是：MinIO Client
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Please set MINIO_ROOT_USER in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Please set MINIO_ROOT_PASSWORD in infra/.env}
      STORAGE_MINIO_BUCKET: ${STORAGE_MINIO_BUCKET:-ai-knowledge-hub-files}
      STORAGE_MINIO_ACCESS_KEY: ${STORAGE_MINIO_ACCESS_KEY:?Please set STORAGE_MINIO_ACCESS_KEY in backend/.env}
      STORAGE_MINIO_SECRET_KEY: ${STORAGE_MINIO_SECRET_KEY:?Please set STORAGE_MINIO_SECRET_KEY in backend/.env}
    volumes:
      - ./minio/app-policy.template.json:/config/app-policy.template.json:ro
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$STORAGE_MINIO_BUCKET"
        printf "$$(tr -d '\n' < /config/app-policy.template.json)" \
          "$$STORAGE_MINIO_BUCKET" \
          "$$STORAGE_MINIO_BUCKET" \
          > /tmp/app-policy.json
        mc admin policy create local ai-knowledge-hub-files-rw /tmp/app-policy.json
        mc admin user add local "$$STORAGE_MINIO_ACCESS_KEY" "$$STORAGE_MINIO_SECRET_KEY"
        mc admin policy attach local ai-knowledge-hub-files-rw --user "$$STORAGE_MINIO_ACCESS_KEY"

volumes:
  mysql_data:
    name: ai-knowledge-hub-mysql-data

  redis_data:
    name: ai-knowledge-hub-redis-data

  qdrant_data:
    name: ai-knowledge-hub-qdrant-data

  minio_data:
    name: ai-knowledge-hub-minio-data
