[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for AI Knowledge Hub"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.14.0",
    "bcrypt==5.0.0",
    "boto3==1.43.64",
    "email-validator==2.2.0",
    "fastapi==0.115.6",
    "openai==2.53.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "pymysql==1.1.1",
    "pypdf==6.16.1",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.20",
    "redis==8.0.1",
    "sqlalchemy==2.0.36",
    "tiktoken==0.12.0",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires real external services such as Redis, MinIO, or AI providers",
]
